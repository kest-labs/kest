version: 1
profiles:
  local:
    include:
      - ".kest/flow/**/*.flow.md"
    env: local
    base_url: "http://127.0.0.1:8025"
    strict: true
    fail_fast: false
    sync: false
  ci:
    include:
      - ".kest/flow/**/*.flow.md"
    env: staging
    base_url: "http://127.0.0.1:8025"
    strict: true
    fail_fast: false
    sync: false
    reports:
      json: ".kest/reports/flow-results.json"
      junit: ".kest/reports/flow-results.xml"
